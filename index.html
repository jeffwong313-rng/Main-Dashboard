<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home Dashboard</title>
<meta name="description" content="Household dashboard: to-dos, shopping, notes, recipes and more.">
<meta name="theme-color" content="#eaeef2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Home">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="styles.css?v=202611031351">
<script>try{window.__H="554fb7a9769ca86be00f647b735d8cffb94cfe131ed6f8cbda3cc71874f9f66b";if(localStorage.getItem("hd.v1.auth")!==window.__H)document.documentElement.classList.add("locked")}catch(e){document.documentElement.classList.add("locked")}</script>
</head>
<body>
<div class="gate" id="gate" role="dialog" aria-modal="true" aria-labelledby="gateTitle">
  <form id="gateForm" autocomplete="off">
    <div class="gate-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <h1 id="gateTitle">Home Dashboard</h1>
    <p>Enter the password to open it. You will only be asked once on this device.</p>
    <input type="password" id="gatePw" placeholder="Password" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Password" required>
    <button class="btn primary" type="submit">Unlock</button>
    <p class="gate-err" id="gateErr" role="alert" hidden>That password is not right. Try again.</p>
  </form>
</div>
<div class="app">
  <header class="top">
    <div>
      <h1 id="hello">Hello</h1>
      <p id="today"></p>
    </div>
    <div class="kpi-tiles" id="kpiTiles" aria-label="Summary"></div>
    <span class="spacer"></span>
    <div class="tools-r">
      <button class="round" id="btnTheme" aria-label="Switch light or dark theme" data-icon="moon"></button>
      <button class="round" id="btnEdit" aria-label="Customize layout" aria-pressed="false" data-icon="grid"></button>
      <button class="round" id="btnSettings" aria-label="Settings and sync" data-icon="gear"><span class="sync-dot" id="syncDot" data-s="off"></span></button>
    </div>
  </header>

  <section class="kpis" id="kpis" aria-label="Weather"><section class="kpi-wx" id="dubWx" aria-label="Dublin, CA weather forecast"></section><div class="tagbar" id="tagBar" aria-label="Tags"></div></section>

  <div class="edit-tray" id="editTray" hidden>
    <div class="msg">Drag a card by its title to move it. Drag the corner to resize. Tap × to hide a card.</div>
    <span id="hiddenChips"></span>
    <button class="chip-btn" id="btnReset">Reset layout</button>
    <button class="chip-btn" id="btnDone" style="background:var(--text);color:var(--bg)">Done</button>
  </div>

  <main class="grid" id="grid"></main>
</div>

<button class="fab" id="fab" aria-label="Quick add" data-icon="plus"></button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="sheet" class="sheet"></dialog>
<datalist id="recipeTitles"></datalist>
<datalist id="eventTags"></datalist>
<script src="app.js?v=202611031351"></script>
</body>
</html>
