name: Update news

on:
  schedule:
    # Checked every 30 minutes; the script only fetches once per 6 AM / 12 PM / 6 PM Pacific slot (GitHub delays or skips scheduled runs, so one run per slot is not reliable).
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch headlines
        run: python3 scripts/fetch_news.py
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
      - name: Commit news.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet && exit 0
          git commit -m "Update news"
          git pull --rebase
          git push
